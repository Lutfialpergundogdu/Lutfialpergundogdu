# GitHub achievements card for the profile README, from the gh-achievements action
# (fork: Lutfialpergundogdu/gh-achievements, upstream: muhammedalikcb/gh-achievements).
# Runs every morning while the repository is active (GitHub pauses schedules after 60 days without activity),
# on demand from the Actions tab, and once when this file changes; commits only when the card changes.
name: Update achievements card

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/achievements.yml

permissions:
  contents: write

jobs:
  card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Lutfialpergundogdu/gh-achievements@v0.2.0
        with:
          output: achievements.svg
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add achievements.svg
          git diff --cached --quiet || git commit -m "Update achievements card"
          git push
